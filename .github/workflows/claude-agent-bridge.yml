name: Claude Agent Bridge

# INFRA — Kvernhaug Agent Bridge V1 (GitHub Issue #6).
#
# Purpose: let a GitHub label change trigger a Claude Code run against a
# bounded issue, WITHOUT the owner having to paste "Ta issue #N" manually.
# See docs/development/AGENT_WORKFLOW.md for the full, authoritative
# behavior contract (state machine, scope rule, deliverable format,
# required secrets/apps). This file only implements the trigger/guard/
# label-transition mechanics -- the actual task work is done by
# anthropics/claude-code-action, driven by an explicit `prompt` that
# points back at the issue and at AGENT_WORKFLOW.md.
#
# State machine (labels live on the ISSUE, not the PR -- see
# AGENT_WORKFLOW.md "Design decision: state lives on the issue"):
#   status:ready | status:changes-requested   (owner-applied, WITH agent:claude)
#     -> status:working    (this workflow, immediately, before any work starts)
#     -> status:review     (this workflow, only if the Claude run succeeds)
#   status:approved                           (owner-applied, after Chief PASS)
#     -> merge is a SEPARATE, always-manual owner action. Never done here.
#
# Anti-loop / trust guards (see "Trigger safety" job condition below):
#   - only fires for the two specific label VALUES the state machine defines
#   - only fires when `agent:claude` is ALSO present on the issue
#   - only fires when the label was applied by the repository owner
#     (github.event.sender.login == github.repository_owner) -- this is
#     also what prevents a loop: every label change THIS workflow itself
#     makes is performed via the workflow's own token/actor, never the
#     human owner's login, so it can never satisfy this condition and
#     re-trigger itself.
#   - no `issue_comment` trigger exists in V1 at all, so there is no
#     comment-reaction surface to loop on in the first place.
#   - concurrency + a live re-check of the issue's CURRENT labels (not just
#     the webhook payload snapshot) prevents duplicate/stale runs.

"on":
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run the bridge against"
        required: true
        type: number
      dry_run:
        description: "Dry run: validate trigger/label state only -- do not change labels or invoke Claude"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  # REQUIRED for the default Claude GitHub App authentication path, which
  # is what this workflow uses (it deliberately does not pass a custom
  # `github_token` to the action). Anthropic's FAQ is explicit: "If you're
  # using the default GitHub App authentication, you must add the
  # `id-token: write` permission to your workflow ... The OIDC token is
  # required in order for the Claude GitHub app to function." Without it,
  # the first real run fails during GitHub App/OIDC auth even with a valid
  # Anthropic credential (Chief review, PR #7, blocker 1).
  id-token: write

concurrency:
  group: claude-agent-bridge-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ── Guard: cheap, always runs, decides whether the real job should ──────
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      trigger_label: ${{ steps.check.outputs.trigger_label }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      # The guard's decision logic lives in .github/scripts/trigger_guard.py
      # (pure, unit-tested — see tests/test_agent_bridge_trigger_guard.py),
      # so it has to be checked out before it can be called.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve issue number and read live labels
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          WEBHOOK_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$DISPATCH_ISSUE"
            dry_run="$DISPATCH_DRY_RUN"
          else
            issue_number="$WEBHOOK_ISSUE"
            dry_run=false
          fi
          live_labels=$(gh issue view "$issue_number" --repo "$REPO" --json labels -q '[.labels[].name]')
          echo "Issue #$issue_number live labels: $live_labels"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "live_labels=$live_labels" >> "$GITHUB_OUTPUT"

      # V1.1 (issue #9): authorization must be ATOMIC with respect to the
      # triggering webhook. V1 only checked the LIVE labels when the guard
      # happened to run, so on issue #8 a `status:ready` applied BEFORE
      # `agent:claude` was still accepted — the runner started late enough
      # that `agent:claude` had appeared by the time the guard looked.
      # trigger_guard.py now requires `agent:claude` to have been present in
      # the labels carried by THAT event (github.event.issue.labels) as well
      # as still live, so adding `agent:claude` afterwards can never
      # retroactively authorize an older status event. No sleeps, no polling,
      # no PAT — just the two independent snapshots.
      - name: Evaluate trigger authorization (event-time + live)
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          EVENT_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          LIVE_LABELS: ${{ steps.context.outputs.live_labels }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 .github/scripts/trigger_guard.py >> "$GITHUB_OUTPUT"
          echo "issue_number=${{ steps.context.outputs.issue_number }}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ steps.context.outputs.dry_run }}" >> "$GITHUB_OUTPUT"

  # ── Execute: only runs if guard says so, and skips the mutating/paid ────
  # steps entirely in dry_run mode.
  execute:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ needs.guard.outputs.issue_number }}
      TRIGGER_LABEL: ${{ needs.guard.outputs.trigger_label }}
    steps:
      - name: Dry run — report and stop
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "DRY RUN for issue #$ISSUE (triggering label: '$TRIGGER_LABEL')."
          echo "Would: set lifecycle label to exactly 'status:working' (dropping ALL other status:* labels, keeping agent:claude/area:*),"
          echo "       run Claude, then set it to exactly 'status:review' on success."
          echo "No labels changed, Claude not invoked, no API cost incurred."

      - name: Check required secret is configured
        if: needs.guard.outputs.dry_run != 'true'
        id: secretcheck
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing credentials and stop
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing == 'true'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: triggered, but neither \`ANTHROPIC_API_KEY\` nor \`CLAUDE_CODE_OAUTH_TOKEN\` is configured as a repository secret. (Note: this preflight can only check the *secret* — it cannot verify that the official Claude GitHub App at https://github.com/apps/claude is installed. If the secret is present but the App is missing, the run will instead fail later, inside the Claude step, and the generic failure path below handles it.) See \`docs/development/AGENT_WORKFLOW.md\` → \"Required secrets and apps\". No work was started; \`$TRIGGER_LABEL\` left in place so this can be retried once configured."
          exit 1

      # Checkout must happen BEFORE the label transition, because the
      # transition uses .github/scripts/lifecycle_labels.py from the repo.
      - name: Checkout
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Chief review-fix (PR #7, blocker 2): lifecycle labels are
      # EXCLUSIVE. Do not merely add the new one and remove the single
      # triggering one -- that left e.g. `status:review` + `status:working`
      # coexisting during the normal review loop. Compute the whole new
      # label set (all lifecycle labels dropped, exactly one added,
      # agent:claude/area:* preserved) and PUT it, so the issue can never
      # carry two contradictory states. Logic + regression tests:
      # .github/scripts/lifecycle_labels.py, tests/test_agent_bridge_labels.py
      - name: Move to status:working (exclusive lifecycle transition)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]' \
            | python3 .github/scripts/lifecycle_labels.py status:working \
            | gh api --method PUT "repos/$REPO/issues/$ISSUE/labels" --input -
          echo "Labels now:"
          gh issue view "$ISSUE" --repo "$REPO" --json labels -q '.labels[].name'

      # V1.2 (issue #12), Chief review fix (PR #13, blockers 1+2): every
      # bridge run for an issue uses ONE fixed, deterministic branch
      # name for that issue's entire lifecycle -- status:ready creates
      # it, every later status:changes-requested round reuses it
      # UNCHANGED. This single name is then used for two independent
      # things below: (1) scoping Claude's push permission to an EXACT,
      # wildcard-free command instead of the unenforced `Bash(git push
      # *)` blocker-1 flagged, and (2) associating the deliverable PR by
      # exact head-branch match instead of the text-heuristic issue-
      # timeline cross-reference blocker-2 flagged. Formula lives once
      # in .github/scripts/branch_policy.py (tests:
      # tests/test_agent_bridge_branch_policy.py) so this workflow, the
      # prompt below, and the tests can never drift apart on it.
      - name: Compute deterministic bridge branch name
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: branch
        run: |
          set -euo pipefail
          echo "name=$(python3 .github/scripts/branch_policy.py "$ISSUE")" >> "$GITHUB_OUTPUT"

      # V1.2 (issue #12): the deliverable gate below needs to know
      # whether a PR already existed on this issue's fixed branch BEFORE
      # this run starts -- captured here, once, prior to invoking
      # Claude. Chief review fix (PR #13, blocker 2): looks the PR up by
      # its EXACT head branch (the name computed above) via `gh pr
      # list`, not the issue timeline's cross-reference heuristic -- a
      # PR either has this exact head ref or it doesn't; no dependency
      # on what Claude wrote in the PR body/title.
      #
      # This value is used for BOTH trigger labels, on opposite sides of
      # the same fact (Chief review, PR #13, round 3): for
      # status:changes-requested it must be non-empty AND change (proof
      # new commits were pushed); for status:ready it must be EMPTY
      # (proof no PR already existed on this reused, deterministic
      # branch before this run -- otherwise a stale PR from an earlier
      # failed/manual run could be mistaken for this run's own
      # deliverable, see deliverable_guard.py's module docstring).
      #
      # Chief review fix (PR #13, round 4): HEAD-SHA alone doesn't prove
      # it's the SAME PR -- the allowlist still permits `gh pr edit`/
      # `gh pr create`, so a status:changes-requested run could in
      # principle re-target the original PR's base away from `master`
      # and open a NEW PR from the same branch, which post-run `gh pr
      # list --head <branch> --base master` would then find with a HEAD
      # SHA that differs from before_head_sha "by coincidence" -- wrongly
      # approved as "the same PR, new commits". Captures the PR NUMBER
      # alongside its HEAD SHA from the exact same query, so the gate can
      # require both: unchanged identity AND changed HEAD.
      # Issue #44 addendum: also captures `isDraft`, so the new Draft-
      # handoff decision below (pr_draft_handoff.py) can tell an
      # already-Draft PR (idempotent no-op) from one that still needs
      # converting -- reuses this SAME query/output, no extra GitHub call.
      - name: Capture pre-run PR state (used by both trigger labels — see deliverable_guard.py)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: before
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          before_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
            --json number,headRefOid,isDraft)
          echo "before_pr_number=$(echo "$before_json" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          echo "before_head_sha=$(echo "$before_json" | jq -r '.[0].headRefOid // empty')" >> "$GITHUB_OUTPUT"
          echo "before_pr_is_draft=$(echo "$before_json" | jq -r '.[0].isDraft // false')" >> "$GITHUB_OUTPUT"

      # Issue #44 -- first half of the PR Draft/Ready-for-review
      # lifecycle wake mechanism, replacing the unreliable comment-only
      # retry (issue #40, REMOVED by this change -- see
      # AGENT_WORKFLOW.md "Deterministic Chief-ready retry signal (V1,
      # issue #40)" for the preserved incident evidence, and "PR
      # Draft/Ready-for-review lifecycle wake mechanism (V1, issue #44)"
      # for the full design). Uses the SAME pre-run PR state the step
      # above just captured -- no extra GitHub call. Decision is
      # pure/testable: .github/scripts/pr_draft_handoff.py,
      # tests/test_agent_bridge_pr_draft_handoff.py. This decision alone
      # is deliberately NON-alarming (always exit 0) -- a missed/skipped
      # Draft *attempt* never blocks Claude's run by itself. `TRIGGER_LABEL`
      # is already a job-level env var (see the `execute` job's `env:`
      # block above). Chief review fix (PR #45): that non-alarming attempt
      # is NOT the whole story any more -- see "Verify PR Draft state
      # before Claude run" below, which turns Draft into a VERIFIED,
      # fail-closed prerequisite for `status:changes-requested`.
      - name: Decide PR Draft handoff (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: draft_decide
        env:
          BEFORE_PR_NUMBER: ${{ steps.before.outputs.before_pr_number }}
          BEFORE_HEAD_SHA: ${{ steps.before.outputs.before_head_sha }}
          BEFORE_PR_IS_DRAFT: ${{ steps.before.outputs.before_pr_is_draft }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pr_draft_handoff.py decide >> "$GITHUB_OUTPUT"

      # The actual mutation -- only for a genuine status:changes-requested
      # handoff onto an existing, non-Draft PR (see pr_draft_handoff.py
      # for every fail-closed/no-op condition). Never runs for
      # status:ready -- there is no PR to convert yet at this point in
      # the run (Claude hasn't created one). A fresh status:ready PR is
      # instead opened directly as Draft by Claude's own `gh pr create
      # --draft` (issue #62), so it goes through the SAME Draft -> Ready
      # transition below (see "Transition PR to Ready for review") as a
      # changes-requested round, instead of relying solely on the
      # `opened` PR event + Chief-ready marker as before issue #62.
      - name: Convert PR to Draft for changes-requested handoff (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && steps.draft_decide.outputs.set_draft == 'true'
        run: |
          set -euo pipefail
          gh pr ready "${{ steps.draft_decide.outputs.pr_number }}" --repo "$REPO" --undo

      # Chief review fix (PR #45, blocking finding): the attempt above was
      # fail-OPEN -- if the pre-run PR lookup was empty, ambiguous, stale,
      # or couldn't prove `isDraft`, the run continued anyway, Claude could
      # produce a new head, and the round could finish with the PR still
      # Ready; `pr_ready_handoff.py` then reads that as a harmless
      # `already_ready` no-op and never emits a `ready_for_review` event --
      # exactly the missed re-review issue #44 exists to prevent. This step
      # re-fetches LIVE PR state (never the pre-run capture from "Capture
      # pre-run PR state") so the verification below is never fooled by a
      # stale/cached read.
      #
      # Chief review fix (PR #45, round 2): also forwards `before_head_sha`
      # (from "Capture pre-run PR state") alongside the live `prs` fetch --
      # identity/Draft alone don't prove the fresh refetch reflects the SAME
      # head that was captured before this run started; a push between the
      # pre-run capture and this refetch could otherwise pass the gate on a
      # different head.
      - name: Refetch live state for Draft verification (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: draft_state
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          prs_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
            --json number,state,baseRefName,headRefOid,headRefName,isDraft)
          jq -n --arg trigger_label "$TRIGGER_LABEL" \
                --arg before_pr_number "${{ steps.before.outputs.before_pr_number }}" \
                --arg before_head_sha "${{ steps.before.outputs.before_head_sha }}" \
                --argjson prs "$prs_json" \
                --arg branch "$BRANCH" \
                '{trigger_label:$trigger_label, before_pr_number:$before_pr_number, before_head_sha:$before_head_sha, prs:$prs, branch:$branch}' \
            > "$RUNNER_TEMP/pr_draft_verify_state.json"

      # Chief review fix (PR #45): makes Draft a VERIFIED prerequisite for
      # `status:changes-requested` -- pure/testable decision in
      # .github/scripts/pr_draft_handoff.py (`verifiser_draft`),
      # tests/test_agent_bridge_pr_draft_handoff.py. Fail-closed exit 1 on
      # a genuine rejection (same exit-code contract as
      # chief_ready_signal.py/pr_ready_handoff.py) -- which, by GitHub
      # Actions' default step-failure behavior, stops the job here and
      # skips "Run Claude Code" entirely. `status:ready` (never Draft) and
      # a proven already-Draft PR both remain non-alarming
      # "prerequisite satisfied" outcomes, exactly as before this fix --
      # only a genuinely unproven Draft state for a changes-requested round
      # now blocks the run. Round 2: also requires the fresh `headRefOid` to
      # equal `before_head_sha` exactly -- a mismatched or missing head is
      # rejected fail-closed the same way as a missing/ambiguous PR.
      - name: Verify PR Draft state before Claude run (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: draft_verify
        run: |
          set -euo pipefail
          python3 .github/scripts/pr_draft_handoff.py verify \
            < "$RUNNER_TEMP/pr_draft_verify_state.json" >> "$GITHUB_OUTPUT"

      # ─── Issue #329: deterministic, fail-closed changes-requested handoff ───
      #
      # Incident (run 35399093833 on issue #327 / PR #328): every gate above
      # passed -- authorized trigger, correct deterministic branch, correct
      # pre-run head, PR converted to Draft, Draft verified -- and the Claude
      # step still finished `conclusion: success` with
      # `permission_denials_count: 11`, NO new commit and an unchanged PR head.
      # The trigger was never the defect; the HANDOFF was. On this path the
      # wrapper handed Claude almost no verified work context and made it
      # rediscover the branch, the PR and the Chief review itself through
      # gh/git calls before it could start on the actual review.
      #
      # This step collects the LIVE state the decision needs. Everything is
      # written straight to files -- `--slurpfile` assembles the state JSON --
      # so the human-written review body never enters a shell variable, a
      # command string, `$GITHUB_OUTPUT` or a `${{ }}` interpolation. See
      # .github/scripts/changes_requested_context.py → "TRANSPORT AV
      # REVIEW-TEKST". `reviews` comes from the GitHub reviews API only:
      # PR comments, comment markers and Claude-generated summaries are never
      # an accepted substitute for the review object.
      - name: Gather live state for changes-requested review context (issue #329)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: cr_state
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BEFORE_PR_NUMBER: ${{ steps.before.outputs.before_pr_number }}
          BEFORE_HEAD_SHA: ${{ steps.before.outputs.before_head_sha }}
          # The authorized Chief identity. Same source the trigger guard
          # already uses for its owner check (.github/scripts/trigger_guard.py)
          # -- a CHANGES_REQUESTED review from anyone else is not a valid work
          # order.
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_LABEL" = "status:changes-requested" ]; then
            gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
              --json number,state,baseRefName,headRefOid,headRefName,isDraft \
              > "$RUNNER_TEMP/cr_prs.json"
            if [ -n "${BEFORE_PR_NUMBER:-}" ]; then
              gh api --paginate "repos/$REPO/pulls/$BEFORE_PR_NUMBER/reviews" --jq '.[]' \
                | jq -s '[.[] | {id, state, commit_id, body, submitted_at, user: {login: .user.login}}]' \
                > "$RUNNER_TEMP/cr_reviews.json"
            else
              echo '[]' > "$RUNNER_TEMP/cr_reviews.json"
            fi
          else
            echo '[]' > "$RUNNER_TEMP/cr_prs.json"
            echo '[]' > "$RUNNER_TEMP/cr_reviews.json"
          fi
          jq -n --arg trigger_label "$TRIGGER_LABEL" \
                --arg issue "$ISSUE" \
                --arg branch "$BRANCH" \
                --arg before_pr_number "${BEFORE_PR_NUMBER:-}" \
                --arg before_head_sha "${BEFORE_HEAD_SHA:-}" \
                --arg repo_owner "$REPO_OWNER" \
                --slurpfile prs "$RUNNER_TEMP/cr_prs.json" \
                --slurpfile reviews "$RUNNER_TEMP/cr_reviews.json" \
                '{trigger_label:$trigger_label, issue:$issue, branch:$branch,
                  before_pr_number:$before_pr_number, before_head_sha:$before_head_sha,
                  repo_owner:$repo_owner, prs:$prs[0], reviews:$reviews[0]}' \
            > "$RUNNER_TEMP/cr_context_state.json"

      # The actual decision -- pure, unit-tested, see
      # .github/scripts/changes_requested_context.py (`bygg_kontekst`) and
      # tests/test_agent_bridge_changes_requested_context.py. Fail-closed
      # exit 1 on a genuine rejection (same exit-code contract as
      # pr_draft_handoff.py/chief_ready_signal.py/pr_ready_handoff.py) --
      # which, by GitHub Actions' default step-failure behavior, stops the job
      # here and skips "Run Claude Code" entirely. No Claude run may start
      # unless the PR, its exact head, and a Chief CHANGES_REQUESTED review on
      # that same exact head are all proven. `status:ready` is a
      # non-alarming "not required" outcome and is not affected at all.
      #
      # On success the module writes the VERIFIED review text to
      # `.agent_bridge_run/chief_review.md` (git-ignored, see .gitignore), and
      # the prompt below points Claude at that path.
      - name: Verify Chief changes-requested review context (issue #329)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: cr_context
        env:
          CONTEXT_BODY_PATH: .agent_bridge_run/chief_review.md
        run: |
          set -euo pipefail
          python3 .github/scripts/changes_requested_context.py verify \
            < "$RUNNER_TEMP/cr_context_state.json" >> "$GITHUB_OUTPUT"

      # ─── Issue #331: stage the checkout-verifier BEFORE the feature-branch
      # checkout, anchored to the current trusted master/workflow checkout ───
      #
      # Incident: issue #327 / PR #328's owner-authorized status:changes-
      # requested retry (run after #329/#330 merged) reused PR #328's
      # pre-#329 head, `6699b63b039b7cefc086fceb65b01eb48adc3542`. Every gate
      # above this point passed -- authorized trigger, correct PR/head,
      # verified CHANGES_REQUESTED review -- but the NEXT step ("Prepare
      # existing agent branch") switches the working tree to that exact old
      # head, which does not contain `.github/scripts/changes_requested_
      # context.py` at all (it was only added later, by #329/#330 itself).
      # The step after that ("Verify local HEAD...") used to run
      # `python3 .github/scripts/changes_requested_context.py checkout-
      # verify` from whatever the working tree happened to contain AFTER
      # that switch -- so the file had simply disappeared, and the job
      # failed before Claude ever started. This was a trust-root/checkout-
      # order bug, not a trigger bug: the verifier must be anchored to the
      # CURRENT trusted checkout, never to whatever the old feature branch's
      # working tree happens to contain.
      #
      # The fix: copy the exact script from THIS trusted master checkout to
      # a runner-owned temp path (`$RUNNER_TEMP`, never inside the repo
      # working tree) now, while HEAD is still on master -- i.e. strictly
      # before the next step switches it. The old feature branch cannot
      # replace the staged copy merely by changing the repo working tree,
      # since the staged copy no longer lives there.
      - name: Stage trusted changes-requested checkout verifier (issue #331)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && needs.guard.outputs.trigger_label == 'status:changes-requested'
        id: cr_verifier_stage
        run: |
          set -euo pipefail
          cp .github/scripts/changes_requested_context.py "$RUNNER_TEMP/changes_requested_context.py"
          echo "path=$RUNNER_TEMP/changes_requested_context.py" >> "$GITHUB_OUTPUT"

      # Root cause #1: `actions/checkout@v4` on an `issues` event lands on the
      # default ref (run 35399093833 confirms `head_branch: master`), so the
      # old prompt made branch discovery Claude's FIRST job in a round that is
      # supposed to be about fixing a review. The wrapper now owns that:
      # fetch the existing agent branch and check out the EXACT head the
      # verified review applies to. Only for status:changes-requested --
      # status:ready has no existing branch to land on and is untouched.
      - name: Prepare existing agent branch for changes-requested round (issue #329)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && needs.guard.outputs.trigger_label == 'status:changes-requested'
        id: cr_branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          EXPECTED_HEAD: ${{ steps.cr_context.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "$EXPECTED_HEAD"
          echo "local_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "local_branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      # Proof, not assumption -- pure/testable decision in
      # .github/scripts/changes_requested_context.py
      # (`verifiser_lokalt_hode`). Same fail-closed exit-code contract: if the
      # working tree is not on the deterministic branch at the exact reviewed
      # head, the job stops here and Claude never runs.
      #
      # Issue #331: this MUST run the copy staged by "Stage trusted
      # changes-requested checkout verifier" above, never
      # `.github/scripts/changes_requested_context.py` read from the repo
      # working tree -- by this point that tree is checked out at the OLD
      # feature head (previous step), which is not guaranteed to contain
      # this file at all. A missing/empty staged copy fails closed before
      # Claude ever runs, exactly like every other rejection on this path.
      - name: Verify local HEAD is the exact reviewed commit (issue #329)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && needs.guard.outputs.trigger_label == 'status:changes-requested'
        id: cr_checkout
        env:
          EXPECTED_HEAD: ${{ steps.cr_context.outputs.head_sha }}
          LOCAL_HEAD: ${{ steps.cr_branch.outputs.local_head }}
          BRANCH: ${{ steps.branch.outputs.name }}
          LOCAL_BRANCH: ${{ steps.cr_branch.outputs.local_branch }}
          STAGED_VERIFIER: ${{ steps.cr_verifier_stage.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${STAGED_VERIFIER:-}" ] || [ ! -s "$STAGED_VERIFIER" ]; then
            echo "Staged checkout verifier missing or empty (${STAGED_VERIFIER:-<unset>}) -- refusing to fall back to the checked-out feature branch's own copy (fail-closed, issue #331)." >&2
            echo "checkout_verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python3 "$STAGED_VERIFIER" checkout-verify >> "$GITHUB_OUTPUT"

      # V1.2 (issue #12): the first real E2E run (issue #11) finished
      # `conclusion: success` with `permission_denials_count: 14` and
      # produced NO branch, NO PR, NO comment -- because this step gave
      # Claude no `--allowedTools` at all. Per Anthropic's own docs,
      # Claude executes ZERO Bash commands by default, and even with
      # Bash access never opens a PR automatically (security.md: "Claude
      # does not automatically create pull requests ... provides a link
      # to the GitHub PR creation page"). The list below is the minimum
      # set of exact git/gh/test commands this bounded workflow actually
      # needs -- never `git merge` or `gh pr merge`. Chief review fix
      # (PR #13, blocker 1): `git push` is no longer a `*`-wildcard rule
      # -- it is scoped to the two EXACT command strings
      # `.github/scripts/branch_policy.py`'s `tillatte_push_kommandoer`
      # defines for this run's fixed branch (see the step above), so no
      # refspec/flag variant can ever target `master`. Rationale for
      # every entry: docs/development/AGENT_WORKFLOW.md → "Claude's
      # allowed tools (V1.2, issue #12)".
      #
      # V1.3 (issue #15): the first live E2E run (issue #14) got past
      # V1.2's Bash allowlist cleanly but then failed closed a step
      # later -- Claude reported `Write` denied both in-repo and in
      # `/tmp`, so no file could ever be created/edited at all. `Write`/
      # `Edit`/`MultiEdit` were never in `--allowedTools`, and this
      # action's headless SDK has no interactive prompt handler, so any
      # permission request that falls through to `ask` is denied by
      # default. The official tag-mode implementation (verified against
      # the exact `anthropics/claude-code-action@v1` revision that ran,
      # `8251c103ac8c1d761882c86aba1412c7f583c844`) deliberately does NOT
      # list `Write`/`Edit` in `--allowedTools` for this reason -- it
      # adds `--permission-mode acceptEdits` instead, which allows file
      # edits inside `$GITHUB_WORKSPACE` (the checked-out repo) only, and
      # still denies writes anywhere else on the runner. This does not
      # touch the Bash allowlist, the branch-scoped push rules, or any
      # other V1.2 control -- see AGENT_WORKFLOW.md → "Permission model:
      # Bash allowlist + acceptEdits (V1.3, issue #15)".
      #
      # V1.4 (issue #154): `python3 -m unittest *` (V1.2) never covered
      # the repo's canonical Web i18n generator entry point, so a Bridge
      # round needing bounded Web NO/EN work (issue #146) had no way to
      # regenerate `web/en/**` other than hand-editing it -- exactly what
      # `.claude/rules/web.md` forbids. Fixed by one additional EXACT
      # (argument-free) rule, `Bash(python3 scripts/generate_web_i18n_pages.py)`
      # -- no wildcard after the script path, so it grants nothing beyond
      # that one literal invocation. See AGENT_WORKFLOW.md → "Canonical
      # Web i18n generator permission (V1.4, issue #154)".
      #
      # V1.5 (issue #201): #200's Bridge run (34447715101) finished the
      # Claude step successfully after 46 turns but reported
      # `permission_denials_count: 2`, and no branch/PR was ever produced
      # on `agent/issue-200` -- because #200's bounded Playwright
      # browser-gate work needs Node/npm/Playwright commands that were
      # simply never in `--allowedTools` at all (this list previously
      # only covered git/gh/pip/unittest/the Web i18n generator). Fixed by
      # nine additional bounded rules -- eight EXACT (argument-free or
      # argument-fixed) rules plus one prefix rule scoped to
      # `npx playwright test`, the one command whose arguments genuinely
      # vary per run (which spec file, which project) -- covering
      # dependency bootstrap and focused verification only. Deliberately
      # NOT granted: `Bash(npm *)`, `Bash(npx *)`, generic `Bash(node *)`,
      # or any `curl`/`wget`/`sudo` rule. See AGENT_WORKFLOW.md → "Bounded
      # Node/Playwright permission pack (V1.5, issue #201)".
      #
      # V1.6 (issue #252): the HO router pointer (#152 -> newest
      # KBH_COS_CHECKPOINT_PTR_V1 -> KBH_COS_LIVE_CHECKPOINT_V1) could go
      # silently stale -- a newer valid checkpoint existed while #152's
      # pointer still targeted an older one. Two additional EXACT
      # (argument-fixed) rules, `Bash(python3 .github/scripts/ho_router_check.py pointer)`
      # and `Bash(python3 .github/scripts/ho_router_check.py verify)`, let
      # Bridge Claude run the same fail-closed orphan-detection check
      # local Claude now uses as the required post-publish verification
      # step (see the prompt below and AGENT_WORKFLOW.md → "HO policy —
      # local and GitHub jobs"). No wildcard: only these two exact
      # invocations, nothing broader.
      #
      # V1.7 (issue #259): issue #257 failed twice in the same distinctive
      # way -- the Claude step itself completed successfully, but
      # `permission_denials_count=1` and no `agent/issue-257` branch ever
      # existed afterward, so the deliverable gate correctly left the
      # issue at `status:working`. Leading hypothesis: Claude Code
      # commonly uses modern `git switch -c <branch>` for branch creation
      # even when the prompt below suggests `git checkout -b`, and
      # `--allowedTools` only ever granted `Bash(git checkout *)`. Fixed
      # by two additional EXACT (argument-fixed, branch-scoped) rules --
      # `Bash(git switch -c <branch> origin/master)` and
      # `Bash(git switch <branch>)`, mirroring the same wildcard-free
      # pattern as the branch-scoped push rules (V1.2) via
      # `.github/scripts/branch_policy.py`'s new `tillatte_switch_kommandoer`
      # -- never a bare `Bash(git switch *)`. This does not change the
      # push rules, the absence of `git merge`/`gh pr merge`,
      # `--permission-mode acceptEdits`, or any other existing control.
      # See "Diagnose missing deliverable" below for the accompanying
      # diagnostics improvement.
      #
      # V1.9 (issue #329): the BROAD CHECKOUT WILDCARD
      # (`Bash(git checkout *)`) existed only because Claude had to find and
      # check out the work branch itself. The wrapper now owns that on the
      # changes-requested path (see the "Prepare existing agent branch" /
      # "Verify local HEAD is the exact reviewed commit" steps above), so it
      # is NARROWED to the same two exact, branch-scoped strings the
      # `git switch` rules already use, via `.github/scripts/branch_policy.py`'s
      # new `tillatte_checkout_kommandoer`. This REDUCES the permission
      # surface -- nothing previously forbidden becomes allowed. `status:ready`
      # keeps exactly what it needs (branch CREATION,
      # `git checkout -b <branch> origin/master`), and a changes-requested
      # round now starts already on the right branch, with
      # `git checkout <branch>` retained only as a cheap re-land if anything
      # moves HEAD during the run.
      #
      # Chief review clarification (PR #330): this does NOT remove every git
      # wildcard from the allowlist. Several broad, non-destructive git rules
      # are deliberately retained and are out of scope for #329 --
      # `Bash(git fetch *)`, `Bash(git branch *)`, `Bash(git status *)`,
      # `Bash(git diff *)`, `Bash(git add *)`, `Bash(git commit *)` and
      # `Bash(git log *)`. The accurate claim is narrower: the broad
      # CHECKOUT wildcard is gone.
      #
      # V1.8 (PÅ JOBB bot-actor allowlist fix): the PÅ JOBB queue
      # dispatcher (.github/workflows/pa-jobb-queue.yml) starts this
      # workflow via `gh workflow run claude-agent-bridge.yml -f ...`,
      # authenticated with the job's own `GITHUB_TOKEN` -- so the
      # resulting `workflow_dispatch` event's actor is the built-in
      # `github-actions[bot]` identity, not a human. Run 34890311304 /
      # job 104131119753 failed exactly here with `anthropics/claude-
      # code-action@v1`'s own actor-verification step: "Workflow
      # initiated by non-human actor: github-actions (type: Bot). Add
      # bot to allowed_bots list or use '*' to allow all bots." --
      # confirmed against the action's source (actor.ts): it strips the
      # `[bot]` suffix and lowercases before comparing against
      # `allowed_bots`, so `github-actions[bot]` normalizes to exactly
      # `github-actions`. `allowed_bots` below allowlists ONLY that one
      # normalized actor name -- not the `'*'` wildcard the action also
      # supports, which would accept ANY bot actor GitHub might ever
      # report here. This does not touch `--allowedTools`, the branch-
      # scoped push/switch rules, `--permission-mode acceptEdits`, the
      # trigger/label guards, or the human/manual `issues: labeled`
      # trigger path -- a human sender never reaches this actor check at
      # all (see actor.ts: "Human actors skip the allowlist check
      # entirely").
      - name: Run Claude Code
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          additional_permissions: |
            workflows: write
          base_branch: master
          claude_args: |
            --allowedTools "Bash(git fetch *),Bash(git checkout -b ${{ steps.branch.outputs.name }} origin/master),Bash(git checkout ${{ steps.branch.outputs.name }}),Bash(git switch -c ${{ steps.branch.outputs.name }} origin/master),Bash(git switch ${{ steps.branch.outputs.name }}),Bash(git branch *),Bash(git status *),Bash(git diff *),Bash(git add *),Bash(git commit *),Bash(git push -u origin ${{ steps.branch.outputs.name }}),Bash(git push origin ${{ steps.branch.outputs.name }}),Bash(git log *),Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr create *),Bash(gh pr view *),Bash(gh pr edit *),Bash(gh pr comment *),Bash(gh pr list *),Bash(pip install -r requirements.txt),Bash(python3 -m unittest *),Bash(python3 scripts/generate_web_i18n_pages.py),Bash(python3 .github/scripts/ho_router_check.py pointer),Bash(python3 .github/scripts/ho_router_check.py verify),Bash(node --version),Bash(npm --version),Bash(npm install --save-dev @playwright/test),Bash(npm install --ignore-scripts),Bash(npm ci --ignore-scripts),Bash(npx playwright --version),Bash(npx playwright install chromium firefox),Bash(npx playwright install --with-deps chromium firefox),Bash(npx playwright test *)"
            --permission-mode acceptEdits
          prompt: |
            You are running as the automated Claude side of the Kvernhaug
            Agent Bridge (docs/development/AGENT_WORKFLOW.md — read it in
            full before doing anything else; it is the authoritative
            behavior contract for this run and takes precedence over any
            summary here).

            Task specification: GitHub issue #${{ env.ISSUE }} in this
            repository. Treat the issue body as your immutable task
            specification once you begin — do not silently expand scope;
            a material scope change requires posting a "SCOPE CHANGE"
            comment on the issue and stopping for owner input, per
            AGENT_WORKFLOW.md.

            This run was triggered by the label `${{ env.TRIGGER_LABEL }}`.

            IMPORTANT (V1.2, issue #12): opening a pull request is NOT
            automatic in this action — by default it only prepares a
            link to a PR creation page, which is not good enough here.
            You have explicit Bash access to a fixed set of git/gh
            commands (see this step's `--allowedTools`) — use them
            directly: `git fetch`, `git checkout -b <branch>` (or the
            modern `git switch -c <branch> origin/master`, also allowed —
            use whichever you'd normally reach for),
            `git add`/`git commit`/`git push`, and `gh pr create` /
            `gh pr view` / `gh pr edit` / `gh pr comment` /
            `gh pr list` / `gh issue view` / `gh issue comment`. Install
            dependencies with `pip install -r requirements.txt` and run
            tests with `python3 -m unittest ...` (the project convention
            is `python3 -m unittest discover -s tests -b`, or a focused
            `python3 -m unittest tests.test_x` for just the module you
            touched). For bounded Web NO/EN work you may also run the
            canonical i18n generator exactly as
            `python3 scripts/generate_web_i18n_pages.py` (no arguments —
            that exact command is the only additional Bash permission
            granted; never hand-edit generated `web/en/**` instead).
            `git merge` and `gh pr merge` are deliberately NOT in your
            allowed tools — never attempt either.

            YOUR BRANCH NAME IS FIXED — use exactly
            `${{ steps.branch.outputs.name }}` (not any name of your own
            choosing, not any name the issue text might suggest). This
            is not a style preference: your push permission is scoped to
            the EXACT commands `git push -u origin ${{ steps.branch.outputs.name }}`
            and `git push origin ${{ steps.branch.outputs.name }}` — any
            other branch name, or any attempt to push to `master`
            (directly or via a `<branch>:master` refspec), is simply a
            different command string and will be denied outright.

            After this step finishes, the workflow independently
            verifies a real deliverable exists — an open PR against
            `master` whose **head branch is exactly**
            `${{ steps.branch.outputs.name }}`, with a non-empty diff
            (or, for a changes-requested run, proof that branch's HEAD
            commit actually changed) — before moving the issue to
            `status:review`. A report/comment alone, or a "success" exit
            with no matching PR, will leave the issue at
            `status:working` for manual follow-up — so you must actually
            create/update the PR on that exact branch, not just describe
            what you would do.

            - If `${{ env.TRIGGER_LABEL }}` is `status:ready`: this is a
              fresh implementation pass. Fetch origin/master, create
              branch `${{ steps.branch.outputs.name }}` from it
              (`git checkout -b ${{ steps.branch.outputs.name }} origin/master`
              or `git switch -c ${{ steps.branch.outputs.name }} origin/master`
              — either is allowed, exactly for this branch name),
              implement exactly what the issue specifies, run the tests
              it requests, commit, push, and open a PR to `master` with
              `gh pr create --draft`, with a report following the
              issue's own "Deliverable" section. Do not merge. Open it
              as **Draft** — the workflow itself converts it to Ready
              for review once the deliverable/Chief-ready checks pass
              (issue #62); do not pass any other visibility flag.
            - If `${{ env.TRIGGER_LABEL }}` is `status:changes-requested`:
              this is a review-fix pass, and the workflow has ALREADY
              done all the discovery for you (issue #329). Before this
              step started it proved, fail-closed, that there is exactly
              one open PR on this issue's deterministic branch against
              `master`, that its head is an exact 40-char SHA, and that
              the repository owner's most recent review decision on that
              PR is a `CHANGES_REQUESTED` whose `commit_id` is that same
              exact head. It then checked that branch out at that exact
              commit and verified local HEAD. So:

              * You are ALREADY on branch
                `${{ steps.branch.outputs.name }}` at commit
                `${{ steps.cr_context.outputs.head_sha }}`.
                Do NOT go looking for the branch, and do NOT reset,
                rebase or re-point it.
              * The PR is
                **#${{ steps.cr_context.outputs.pr_number }}** — verified.
                Do NOT run `gh pr list` / `gh pr view` to find it.
              * **Chief's review is your work order, and it is already
                on disk**: read the file
                `.agent_bridge_run/chief_review.md` (verified review
                `${{ steps.cr_context.outputs.review_id }}` by
                `${{ steps.cr_context.outputs.review_author }}`,
                submitted
                `${{ steps.cr_context.outputs.review_submitted_at }}`).
                That file is the authoritative text. Do NOT reconstruct
                the review from PR comments, comment markers or any
                earlier summary — those are not the review object and
                are not authoritative here.

              Then, in this order:

              1. Read `.agent_bridge_run/chief_review.md` in full.
              2. Address ONLY the points Chief raised in it. Do not
                 re-address already-resolved points. Do not perform your
                 own re-review of the PR, and do not fix unrelated code,
                 style or tests you happen to notice — that is scope
                 expansion and it is not authorized by this round.
              3. Run the focused tests for what you touched, plus the
                 repo's required Python suite
                 (`python3 -m unittest discover -s tests -b`).
              4. Commit, and push to this SAME branch with
                 `git push origin ${{ steps.branch.outputs.name }}`.
              5. Update the PR description/report to reflect the fix.

              Never merge. Never deploy. `.agent_bridge_run/` is
              git-ignored runtime state for this handoff — never commit
              it, and never edit it. If a review point genuinely cannot
              be addressed within this issue's scope, STOP and post a
              comment on the issue or PR explaining exactly which point
              and why, rather than guessing or widening the change.

            For BOTH trigger paths, perform the final post-verification
            HO step in AGENT_WORKFLOW.md, section "HO policy — local and
            GitHub jobs", before the final outcome report. Use the same
            policy as local Claude: resolve #152's existing router, check
            material change and single-writer ownership, and report
            `HO UPDATED: YES/NO` with its evidence or reason. Do not write
            both the legacy AUTO body and a ROLLING checkpoint. The
            wrapper's deliverable/review/Ready checks below have not run
            yet; keep those gates pending in any checkpoint you publish.
            If you do publish a checkpoint and its pointer (issue #252):
            after appending the pointer to #152, run
            `python3 .github/scripts/ho_router_check.py verify` (fresh
            #152 comments as `pointer_comments`, the checkpoint issue's
            fresh comments as `target_comments`, its number as
            `target_issue`) and only report `HO UPDATED: YES` if it exits
            0 with `status=OK` — any other status (e.g. `ORPHAN`) means the
            publish did not verifiably land and must be reported as such,
            never as a success.

            Do not touch `raw_data/unmatched_malt.json` or any other
            unrelated local/uncommitted state. Never push directly to
            `master`. Never merge. When you are done (or when you must
            stop for a scope/owner decision), post a clear final comment
            on the issue or PR summarizing the outcome — the workflow
            itself will move the issue to `status:review` only if this
            step completes successfully AND the post-run deliverable
            check passes.

      # V1.2 (issue #12): a `success()` Claude step is NOT proof of a
      # deliverable -- issue #11 proved that directly (conclusion:
      # success, permission_denials_count: 14, zero branch/PR/comment
      # produced). Chief review fix (PR #13, blocker 2): look the
      # associated PR up by exact head-branch match (the same fixed name
      # from the "Compute deterministic bridge branch name" step) rather
      # than the issue timeline's cross-reference heuristic, which could
      # miss a fully correct PR the prompt never forced to contain a
      # specific "#N" reference string. `gh pr list --json` already
      # returns a JSON array in exactly the shape deliverable_guard.py
      # expects, so no per-PR loop or jq assembly is needed any more.
      - name: Gather post-run PR evidence
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success()
        id: evidence
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          prs_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
            --json number,state,baseRefName,headRefOid,additions,deletions,changedFiles)
          echo "Associated PR (head=$BRANCH, base=master): $prs_json"
          echo "$prs_json" > "$RUNNER_TEMP/deliverable_prs.json"

      # The actual decision -- pure, unit-tested, see
      # .github/scripts/deliverable_guard.py and
      # tests/test_agent_bridge_deliverable_guard.py.
      - name: Verify a real deliverable exists
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success()
        id: deliverable
        env:
          BEFORE_HEAD_SHA: ${{ steps.before.outputs.before_head_sha }}
          BEFORE_PR_NUMBER: ${{ steps.before.outputs.before_pr_number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deliverable_guard.py < "$RUNNER_TEMP/deliverable_prs.json" >> "$GITHUB_OUTPUT"

      # V1.7 (issue #259, scope item 5): only runs when the deliverable
      # gate above just rejected the run -- cheap, workflow-token-only
      # fact-check (never Claude's --allowedTools, never the Claude
      # transcript itself, so this adds no "unsafe full-output logging"
      # surface). Whether the issue's deterministic branch made it to
      # `origin` at all is a fact fully independent of what Claude said
      # about itself, and is exactly the fingerprint issue #257 exhibited
      # (no branch, ever) versus a run that got further before stopping.
      #
      # Chief review fix (PR #261, blocker 1): the ORIGINAL version of this
      # step used `git ls-remote --heads origin "$BRANCH"`, which resolves
      # its Git remote credentials however the "Run Claude Code" step left
      # them -- but `anthropics/claude-code-action` installs a temporary
      # GitHub App token for that step and revokes it again in its own
      # post-step, so relying on whatever Git credential state remains
      # afterward was fragile in exactly the failure path this diagnostic
      # exists to help with. Fixed: `gh api`, authenticated purely by this
      # job's own `GH_TOKEN` (`${{ github.token }}`, set at job level
      # above) -- the same workflow token every other step in this job
      # already uses for `gh issue`/`gh pr` calls, entirely independent of
      # anything Claude's own step did to Git's credential helper.
      # Fail-closed, unchanged in direction from before: any non-2xx
      # response from `gh api` (a genuine "branch not found", or any other
      # API error) is treated the same way this step already treated a
      # `git ls-remote` miss -- `remote_branch_exists=false` -- so this
      # step still cannot silently report "the branch exists" when the
      # check itself was unable to confirm that. `if gh api ...; then`
      # is deliberately used (not `gh api ... || true`) so `set -euo
      # pipefail` still catches any *other* unexpected failure in this
      # step, since a failing command inside an `if` condition does not
      # trigger `errexit` in bash.
      - name: Check remote branch existence for missing-deliverable diagnosis (issue #259)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok != 'true'
        id: branch_check
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/$BRANCH" --silent; then
            echo "remote_branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pure, unit-tested decision -- see
      # .github/scripts/branch_setup_diagnosis.py and
      # tests/test_agent_bridge_branch_setup_diagnosis.py. Distinguishes a
      # likely permission-denied branch-setup step (status:ready, no
      # remote branch at all -- issue #257's exact fingerprint) from
      # every other missing-deliverable cause, so the report below can say
      # which one this run hit instead of a single generic message.
      - name: Diagnose missing deliverable (issue #259)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok != 'true'
        id: diagnose
        env:
          REMOTE_BRANCH_EXISTS: ${{ steps.branch_check.outputs.remote_branch_exists }}
          BEFORE_HEAD_SHA: ${{ steps.before.outputs.before_head_sha }}
          BEFORE_PR_NUMBER: ${{ steps.before.outputs.before_pr_number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/branch_setup_diagnosis.py >> "$GITHUB_OUTPUT"

      - name: Move to status:review on success (exclusive lifecycle transition)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true'
        id: promote
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]' \
            | python3 .github/scripts/lifecycle_labels.py status:review \
            | gh api --method PUT "repos/$REPO/issues/$ISSUE/labels" --input -
          echo "Labels now:"
          gh issue view "$ISSUE" --repo "$REPO" --json labels -q '.labels[].name'

      # Issue #32 -- repo-side adapter to the native ChatGPT Work
      # event-triggered PR task, which supports PR activity (incl. PR
      # comments) but not issue labels. Only reachable AFTER the Issue
      # is already live as status:review (this step is gated on
      # `success()`, which by GitHub Actions semantics covers every
      # step so far in this job, including "Move to status:review"
      # above). Refetches LIVE state -- not anything cached from before
      # the Claude step ran -- so the decision in chief_ready_signal.py
      # is made on current reality, per AGENT_WORKFLOW.md "Ordering /
      # race safety". The PR used for the existing-comments lookup here
      # is provisional (first match on the deterministic branch); the
      # actual accept/reject decision, including re-verifying there is
      # EXACTLY one such PR, happens in the pure Python helper, not here.
      - name: Refetch live state for Chief-ready signal (issue #32)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true'
        id: signal_state
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          labels_json=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]')
          prs_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
            --json number,state,baseRefName,headRefOid,headRefName)
          pr_number_for_comments=$(echo "$prs_json" | jq -r '.[0].number // empty')
          if [ -n "$pr_number_for_comments" ]; then
            comments_json=$(gh pr view "$pr_number_for_comments" --repo "$REPO" --json comments -q '[.comments[].body]')
          else
            comments_json='[]'
          fi
          jq -n --argjson issue_number "$ISSUE" \
                --argjson issue_labels "$labels_json" \
                --argjson prs "$prs_json" \
                --argjson comments "$comments_json" \
                --arg branch "$BRANCH" \
                '{issue_number:$issue_number, issue_labels:$issue_labels, prs:$prs, comments:$comments, branch:$branch}' \
            > "$RUNNER_TEMP/chief_ready_state.json"

      # Pure/testable decision -- see .github/scripts/chief_ready_signal.py
      # and tests/test_agent_bridge_chief_ready_signal.py. Fail-closed:
      # emits `post=false` (no marker written) on any ambiguity, and
      # `duplicate=true` (also no marker) if the exact (issue, head)
      # marker already exists on the PR -- idempotent no-op, not a
      # retry/error. Chief review (PR #34): a fail-closed rejection
      # (`post=false` AND `duplicate=false`) now exits non-zero, so THIS
      # step itself fails and the "Report Chief-ready signal emission
      # failure" step below actually runs instead of the job finishing
      # green with no marker and no report. `post=true`/`duplicate=true`
      # both still exit 0.
      - name: Decide Chief-ready signal (issue #32)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true'
        id: signal
        run: |
          set -euo pipefail
          python3 .github/scripts/chief_ready_signal.py "$RUNNER_TEMP/chief_ready_comment.txt" \
            < "$RUNNER_TEMP/chief_ready_state.json" >> "$GITHUB_OUTPUT"

      # The one top-level PR comment this whole feature exists to emit.
      # Deliberately NOT part of Claude's run or --allowedTools -- this
      # runs after Claude's step entirely, with the workflow's own
      # token, so no new Claude trigger surface is introduced.
      - name: Post Chief-ready signal comment (issue #32 adapter)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true' && steps.signal.outputs.post == 'true'
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.signal.outputs.pr_number }}" --repo "$REPO" --body-file "$RUNNER_TEMP/chief_ready_comment.txt"

      # Issue #44 -- second half of the PR Draft/Ready-for-review
      # lifecycle wake mechanism, REPLACING the unreliable comment-only
      # retry that used to sit here (issue #40's 900s-sleep-then-retry-
      # comment steps -- see AGENT_WORKFLOW.md "Deterministic Chief-ready
      # retry signal (V1, issue #40)" for the preserved incident evidence
      # this replaces, and "PR Draft/Ready-for-review lifecycle wake
      # mechanism (V1, issue #44)" for the full design). Fresh refetch
      # AFTER the Chief-ready marker step -- never reuses anything cached
      # from before that step, same "Ordering / race safety" discipline
      # as the original signal. Fetches `isDraft` (new) and PR reviews
      # (to detect an existing formal review for the exact head) on top
      # of what the original signal refetch already gathers.
      #
      # Runs whenever "Decide Chief-ready signal" itself SUCCEEDED
      # (`steps.signal.outcome == 'success'` -- both post=true and
      # duplicate=true exit 0) rather than `steps.signal.outputs.post ==
      # 'true'` alone, so an idempotent duplicate-marker outcome can
      # still complete a pending Draft -> Ready transition for that same
      # head (e.g. a re-run of this workflow step).
      - name: Refetch live state for PR ready-for-review transition (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true' && steps.signal.outcome == 'success'
        id: ready_state
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          labels_json=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]')
          prs_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open \
            --json number,state,baseRefName,headRefOid,headRefName,isDraft)
          pr_number_for_lookup=$(echo "$prs_json" | jq -r '.[0].number // empty')
          if [ -n "$pr_number_for_lookup" ]; then
            comments_json=$(gh pr view "$pr_number_for_lookup" --repo "$REPO" --json comments -q '[.comments[].body]')
            reviews_json=$(gh pr view "$pr_number_for_lookup" --repo "$REPO" --json reviews -q '.reviews')
          else
            comments_json='[]'
            reviews_json='[]'
          fi
          jq -n --argjson issue_number "$ISSUE" \
                --argjson issue_labels "$labels_json" \
                --argjson prs "$prs_json" \
                --argjson comments "$comments_json" \
                --argjson reviews "$reviews_json" \
                --arg branch "$BRANCH" \
                --arg signaled_head_sha "${{ steps.signal.outputs.head_sha }}" \
                --arg trigger_label "$TRIGGER_LABEL" \
                '{issue_number:$issue_number, issue_labels:$issue_labels, prs:$prs, comments:$comments, reviews:$reviews, branch:$branch, signaled_head_sha:$signaled_head_sha, trigger_label:$trigger_label}' \
            > "$RUNNER_TEMP/pr_ready_state.json"

      # Pure/testable decision -- see .github/scripts/pr_ready_handoff.py
      # and tests/test_agent_bridge_pr_ready_handoff.py. Fail-closed exit
      # 1 on a genuine rejection (same exit-code contract as
      # chief_ready_signal.py, so the failure-report step below actually
      # runs) -- but `already_ready=true` (a proven prior run of THIS
      # mechanism already completed the transition for this exact head,
      # per the KBH_PR_READY_TRANSITION_DONE_V1 marker check, PR #45
      # round 3, generalized to every trigger label by issue #62) is a
      # NON-alarming no-op and still exits 0.
      # Passes an output-file path so the script can write that same
      # done-marker text (only when set_ready=true) for the posting step
      # below to actually post -- same pattern as chief_ready_signal.py.
      - name: Decide PR ready-for-review transition (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true' && steps.signal.outcome == 'success'
        id: ready_decide
        run: |
          set -euo pipefail
          python3 .github/scripts/pr_ready_handoff.py "$RUNNER_TEMP/pr_ready_done_marker.txt" \
            < "$RUNNER_TEMP/pr_ready_state.json" >> "$GITHUB_OUTPUT"

      # The one state-transition mutation this whole feature exists to
      # perform -- structurally a DIFFERENT GitHub event family
      # (`ready_for_review`) than a PR comment, which is exactly what
      # issue #44 replaces the unreliable comment-only retry (issue #40)
      # with. Only fires when the PR is actually Draft (see
      # pr_ready_handoff.py's `isDraft` check) -- true for round 1 too
      # since issue #62 (Claude's `gh pr create --draft`), so this now
      # normally DOES fire on a fresh status:ready round as well, not
      # only on status:changes-requested rounds.
      - name: Transition PR to Ready for review (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true' && steps.signal.outcome == 'success' && steps.ready_decide.outputs.set_ready == 'true'
        id: transition
        run: |
          set -euo pipefail
          gh pr ready "${{ steps.ready_decide.outputs.pr_number }}" --repo "$REPO"

      # PR #45 round 3 fix: posts the KBH_PR_READY_TRANSITION_DONE_V1
      # marker as proof, for a LATER re-run of this same workflow step
      # (e.g. after a transient failure downstream), that THIS mechanism
      # -- not something external -- already performed the Draft -> Ready
      # transition for this exact head. Only runs immediately after the
      # transition above actually succeeded, so the marker is never
      # posted for a head that was not really transitioned by this run.
      - name: Post PR ready-transition-done marker (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok == 'true' && steps.signal.outcome == 'success' && steps.ready_decide.outputs.set_ready == 'true' && steps.transition.outcome == 'success'
        id: marker_post
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.ready_decide.outputs.pr_number }}" --repo "$REPO" --body-file "$RUNNER_TEMP/pr_ready_done_marker.txt"

      # Failure semantics (issue #32, "Failure semantics"): if emission
      # fails AFTER status:review was already set (steps.promote.outcome
      # captures that independent of what fails later), do not roll the
      # Issue backwards and do not merge anything -- just report clearly.
      # `steps.promote.outcome` (not `success()`) is used here because it
      # reflects that ONE step's own result regardless of which later
      # step is what actually failed. Chief review fix (issue #44):
      # scoped to `steps.signal.outcome == 'failure'` specifically, so a
      # failure in the LATER, separate "Decide PR ready-for-review
      # transition" step (which has its own, more accurate report step
      # below) is never misattributed to this one.
      - name: Report Chief-ready signal emission failure — issue stays at status:review
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.promote.outcome == 'success' && steps.signal.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: issue #$ISSUE reached \`status:review\`, but emitting the Chief-ready PR signal comment failed -- see this workflow run's logs. The Issue is left at \`status:review\` (not rolled back) and nothing was merged; the existing hourly Chief watch remains the fallback path if this signal was missed."

      # Issue #44: distinct failure-report step scoped to the NEW
      # ready-for-review transition gate specifically, so a rejection
      # here is never misattributed to the (separate, earlier,
      # already-successful) Chief-ready marker step above. Same failure
      # semantics as issue #32's own report: status:review is NOT rolled
      # back and nothing is merged -- the hourly Chief watch, and (for a
      # first-round PR) the existing `opened`-event wake, remain the
      # fallback paths.
      - name: Report PR ready-for-review transition failure — issue stays at status:review
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.promote.outcome == 'success' && steps.ready_decide.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: issue #$ISSUE reached \`status:review\` and the Chief-ready marker was posted, but transitioning the PR to Ready for review failed -- see this workflow run's logs. The Issue is left at \`status:review\` (not rolled back) and nothing was merged; the hourly Chief watch (and, for a first-round PR, the existing \`opened\`-event wake) remain the fallback paths if this transition was missed."

      # Chief review fix (PR #45, round 5): the two report steps above only
      # cover a FAILING decision (`steps.ready_decide.outcome == 'failure'`)
      # or a FAILING signal step -- neither matches the case where
      # `pr_ready_handoff.py` correctly said `set_ready=true` (so
      # `ready_decide` itself SUCCEEDED) and the actual mutation, `gh pr
      # ready` in the "Transition PR to Ready for review" step, then fails
      # (e.g. a transient GitHub API error). That failure previously fell
      # through every existing report step -- the generic one is excluded
      # because `steps.promote.outcome == 'success'`, and neither dedicated
      # one above matches because `ready_decide`/`signal` both succeeded --
      # leaving the run silently green-ish with no comment at all and no
      # `ready_for_review` wake. Scoped specifically to
      # `steps.transition.outcome == 'failure'` so it can never be
      # misattributed to (or double-fire alongside) the `ready_decide`
      # failure step above, which requires the opposite
      # (`steps.ready_decide.outcome == 'failure'`) and therefore can never
      # be true at the same time as this one.
      - name: Report PR ready-for-review transition command failure — issue stays at status:review (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.promote.outcome == 'success' && steps.transition.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: issue #$ISSUE reached \`status:review\`, the Chief-ready marker was posted, and the ready-for-review transition was approved, but running \`gh pr ready\` itself failed -- see this workflow run's logs. The Issue is left at \`status:review\` (not rolled back) and nothing was merged; the hourly Chief watch (and, for a first-round PR, the existing \`opened\`-event wake) remain the fallback paths if this transition was missed."

      # Chief review fix (PR #45, round 5): the done-marker post is the
      # LAST step of the guaranteed handoff chain, so its own failure needs
      # the same distinct treatment for the same reason as above -- by the
      # time this step runs, `gh pr ready` (the step above) has already
      # SUCCEEDED, so the real `ready_for_review` GitHub event this whole
      # feature exists to produce has already fired; this failure only
      # means the KBH_PR_READY_TRANSITION_DONE_V1 proof text
      # (pr_ready_handoff.py's "already Ready" safety check for a LATER
      # changes-requested round on this same head) never got posted.
      # Reported distinctly, not silently, so that gap is visible rather
      # than assumed away.
      - name: Report PR ready-transition-done marker post failure — issue stays at status:review (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.promote.outcome == 'success' && steps.marker_post.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: issue #$ISSUE reached \`status:review\` and the PR was successfully transitioned to Ready for review, but posting the \`KBH_PR_READY_TRANSITION_DONE_V1\` proof marker afterward failed -- see this workflow run's logs. The Issue is left at \`status:review\` (not rolled back) and nothing was merged; the real \`ready_for_review\` wake already fired, so this alone should not cause a missed re-review, but a later \`status:changes-requested\` round on this exact head could be unable to prove this mechanism already performed the transition -- check the PR's live Draft state and comments before relying on that idempotency path."

      # Chief review fix (PR #45): dedicated failure report for the NEW
      # pre-Claude Draft-verification gate, scoped specifically to
      # `steps.draft_verify.outcome == 'failure'` so it is never
      # misattributed to the generic failure step below (which would
      # otherwise also match, since `steps.promote` never even runs when
      # this gate fails before Claude does). Claude never ran this round --
      # the Issue is simply left at `status:working`, same state it was
      # already in, so there is nothing to roll back.
      - name: Report Draft-verification failure — Claude did not run this round (issue #44)
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.draft_verify.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: this \`status:changes-requested\` run could not verify the PR was actually in Draft state before starting Claude, so Claude was NOT run this round (issue #44: Draft is a verified, fail-closed prerequisite, not a best-effort attempt) -- see this workflow run's logs for the exact reason. Issue left at \`status:working\`; check the PR's live state, then either fix and re-trigger manually, or re-apply \`status:changes-requested\` once resolved."

      # V1.2 (issue #12): the case that was missing entirely before this
      # fix -- Claude's own step reported success, but the deliverable
      # gate above says otherwise. Deliberately does NOT invent a new
      # lifecycle label (issue #12 instruction); stays at
      # `status:working`, same as a hard failure, but with a comment
      # that says clearly this was a *verification* failure, not a
      # crash.
      #
      # V1.7 (issue #259): the comment now also carries the diagnosis from
      # "Diagnose missing deliverable" above, so a likely permission-denied
      # branch-setup step (issue #257's exact fingerprint --
      # `branch_never_pushed`) reads as a distinguishable diagnosis in the
      # report, not folded into the same generic message as every other
      # missing-deliverable cause.
      - name: Report missing deliverable — leave at status:working for manual follow-up
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && success() && steps.deliverable.outputs.ok != 'true'
        env:
          REASON: ${{ steps.deliverable.outputs.reason }}
          DIAGNOSIS: ${{ steps.diagnose.outputs.diagnosis }}
          DIAGNOSIS_REASON: ${{ steps.diagnose.outputs.reason }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: the Claude run finished without errors, but no verifiable deliverable was found — $REASON Diagnosis (issue #259): \`$DIAGNOSIS\` — $DIAGNOSIS_REASON Issue left at \`status:working\` (V1.2, issue #12: a green Claude process is necessary but never sufficient by itself). Check the workflow run's logs, then either fix and re-trigger manually, or move the issue back to \`status:ready\`/\`status:changes-requested\` once ready to retry."

      # Issue #32: scoped to exclude the case where "Move to
      # status:review" already succeeded -- that case has its own,
      # more accurate failure step above ("... issue stays at
      # status:review"), since this generic message's claim that the
      # Issue is "left at status:working" would be WRONG once
      # status:review has actually been reached. Issue #44 (PR #45):
      # also excludes `steps.draft_verify.outcome == 'failure'`, which
      # has its own dedicated, more accurate report step above.
      - name: Report failure — leave at status:working for manual follow-up
        if: needs.guard.outputs.dry_run != 'true' && steps.secretcheck.outputs.missing != 'true' && failure() && steps.promote.outcome != 'success' && steps.draft_verify.outcome != 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: the automated run failed or was interrupted. Issue left at \`status:working\` — see the failed workflow run's logs for details, then either fix and re-trigger manually, or move the issue back to \`status:ready\`/\`status:changes-requested\` once ready to retry."

  # ── Owner GO/NO-GO notification (issue #66) ─────────────────────────────
  # INDEPENDENT of guard/execute above: fires on a `status:approved` label
  # event (owner-applied, after a Chief PASS review — see AGENT_WORKFLOW.md
  # "Work-side Chief task"), never invokes Claude, and never touches
  # --allowedTools/the Claude step. Purpose: a real, event-driven, repo-side
  # owner notification, because issue #66 observed that the native ChatGPT
  # Work-side "separately notifies the owner with a GO/NO-GO prompt" step
  # is not reliable enough alone (exact-head Chief APPROVED reached on
  # issue #59 / PR #64 with no clear owner-facing prompt) — the same class
  # of gap issues #32/#40/#44 already fixed for the Chief-review wake path,
  # fixed here the same way: a deterministic, unit-tested, fail-closed
  # decision (.github/scripts/go_notify_signal.py) plus its own atomic
  # trigger authorization (.github/scripts/approved_notify_guard.py — a
  # deliberately separate, single-label sibling of trigger_guard.py, so
  # `status:approved` is never added to the list that gates the
  # Claude-invoking `execute` job above). Preserves every existing
  # guardrail: no auto-merge, no new Claude trigger surface, the existing
  # hourly `Kvernhaug Approval Watch` and event-Chief behavior are
  # completely untouched.
  notify_guard:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      issue_number: ${{ steps.context.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve issue number and read live labels
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEBHOOK_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          live_labels=$(gh issue view "$WEBHOOK_ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]')
          echo "Issue #$WEBHOOK_ISSUE live labels: $live_labels"
          echo "issue_number=$WEBHOOK_ISSUE" >> "$GITHUB_OUTPUT"
          echo "live_labels=$live_labels" >> "$GITHUB_OUTPUT"

      # Same event-time + live authorization discipline as the main
      # guard job's trigger_guard.py (issue #9/V1.1), but via a
      # deliberately separate module scoped to exactly one label — see
      # approved_notify_guard.py's module docstring for why it is not a
      # reuse of trigger_guard.py.
      - name: Evaluate GO/NO-GO notification authorization (event-time + live)
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          EVENT_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          LIVE_LABELS: ${{ steps.context.outputs.live_labels }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 .github/scripts/approved_notify_guard.py >> "$GITHUB_OUTPUT"

  notify:
    needs: notify_guard
    if: needs.notify_guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ needs.notify_guard.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deterministic bridge branch name
        id: branch
        run: |
          set -euo pipefail
          echo "name=$(python3 .github/scripts/branch_policy.py "$ISSUE")" >> "$GITHUB_OUTPUT"

      # Fresh refetch — never anything cached from before this job started
      # (same "Ordering / race safety" discipline as chief_ready_signal.py
      # / pr_ready_handoff.py). Idempotency dedup reads the ISSUE's own
      # comments (not the PR's) because the GO/NO-GO notification is
      # posted on the issue — the same place every other owner-facing
      # Bridge notice in this workflow already goes.
      #
      # `--state all` (issue #264, run #512 race) — not `--state open` —
      # because the exact-head-approved PR can legitimately already be
      # MERGED by the time this job refetches (owner merged between the
      # status:approved event and this refetch). go_notify_signal.py's
      # `vurder_go_notify` needs to SEE that MERGED PR to tell that benign
      # case apart from a genuinely missing/wrong PR; it still only ever
      # accepts it as proof if it is the one exact-branch candidate with
      # its own APPROVED review on its own exact head. Reviews are fetched
      # for every candidate PR found (not just the first) so ordering
      # never matters and the open-PR path's reviews are never dropped.
      - name: Refetch live state for GO/NO-GO notification (issue #66, #264)
        id: notify_state
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          labels_json=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]')
          prs_json=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state all \
            --json number,state,baseRefName,headRefOid,headRefName)
          reviews_json='[]'
          for pr_number_for_lookup in $(echo "$prs_json" | jq -r '.[].number'); do
            pr_reviews_json=$(gh pr view "$pr_number_for_lookup" --repo "$REPO" --json reviews -q '.reviews')
            reviews_json=$(jq -c -n --argjson a "$reviews_json" --argjson b "$pr_reviews_json" '$a + $b')
          done
          comments_json=$(gh issue view "$ISSUE" --repo "$REPO" --json comments -q '[.comments[].body]')
          jq -n --argjson issue_number "$ISSUE" \
                --argjson issue_labels "$labels_json" \
                --argjson prs "$prs_json" \
                --argjson reviews "$reviews_json" \
                --argjson comments "$comments_json" \
                --arg branch "$BRANCH" \
                '{issue_number:$issue_number, issue_labels:$issue_labels, prs:$prs, reviews:$reviews, comments:$comments, branch:$branch}' \
            > "$RUNNER_TEMP/go_notify_state.json"

      # Pure/testable decision — see .github/scripts/go_notify_signal.py
      # and tests/test_agent_bridge_go_notify_signal.py. Fail-closed exit 1
      # on a genuine rejection (same exit-code contract as
      # chief_ready_signal.py) — `post=true`/`duplicate=true` both exit 0.
      - name: Decide GO/NO-GO notification (issue #66)
        id: go_notify
        run: |
          set -euo pipefail
          python3 .github/scripts/go_notify_signal.py "$RUNNER_TEMP/go_notify_comment.txt" \
            < "$RUNNER_TEMP/go_notify_state.json" >> "$GITHUB_OUTPUT"

      # The one owner-facing comment this whole feature exists to emit.
      # Deliberately NOT part of Claude's run or --allowedTools — posted
      # entirely with the workflow's own token, so no new Claude trigger
      # surface is introduced.
      - name: Post GO/NO-GO notification comment (issue #66)
        if: steps.go_notify.outputs.post == 'true'
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/go_notify_comment.txt"

      # Fail-closed rejection (live state no longer satisfies the notify
      # contract — e.g. no APPROVED review yet on the exact live head, or
      # the issue no longer exclusively status:approved) is a genuine
      # failure, not a silent no-op. Never rolls back any label and never
      # merges anything — the existing hourly Chief watch remains the
      # fallback path for owner visibility.
      - name: Report GO/NO-GO notification rejection (issue #66)
        if: failure() && steps.go_notify.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ **Claude Agent Bridge**: issue #$ISSUE was labeled \`status:approved\`, but the owner GO/NO-GO notification could not be verified on a fresh refetch of live state — see this workflow run's logs for the exact reason. No merge action was taken and no label was changed; the existing hourly Chief watch remains the fallback path for owner visibility."